<div style="margin: 30px; font-family: Arial;">
  <h2>Gestión de Municipios</h2>

  <!-- Desplegable -->
  <label>Departamento:</label><br>
  <select (change)="onSelectDepto($event)" style="padding: 5px; width: 250px;">
    <option value="">-- Seleccione --</option>
    <option *ngFor="let d of departamentos" [value]="d.idDepartamento">
      {{ d.nombre }}
    </option>
  </select>

  <!-- Lista de Municipios -->
  <div *ngIf="idDeptoSeleccionado" style="margin-top: 20px;">
    <h3>Municipios:</h3>
    <ul>
      <li *ngFor="let m of municipios">{{ m.nombre }}</li>
    </ul>

    <!-- Formulario simple de registro -->
    <h3>Registrar Municipio:</h3>
    <input [(ngModel)]="nombreNuevoMunicipio" placeholder="Nuevo municipio" style="padding: 5px;">
    <button (click)="guardar()" style="padding: 6px 12px; margin-left: 5px;">Guardar</button>
    <p style="color: green;">{{ mensaje }}</p>
  </div>
</div>
